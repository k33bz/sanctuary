name: build

on:
  push:
    branches: [main, '26.*']
  pull_request:

jobs:
  build:
    if: github.repository_owner == 'k33bz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build + tests
        run: ./gradlew build
      - name: Worldgen copies match the Minecraft jar
        run: python3 scripts/check_worldgen.py
      - name: Diagnose mappings (only on failure)
        if: failure()
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name "*minecraft*.jar" 2>/dev/null | grep -viE "sources|javadoc|intermediary" | head -1)
          echo "== $J"
          javap -cp "$J" net.minecraft.server.level.ServerLevel 2>/dev/null | grep -iE "spawn"
          echo "== ServerPlayer"
          javap -cp "$J" net.minecraft.server.level.ServerPlayer 2>/dev/null | grep -iE "spawn|teleport"
          echo "== LevelData"
          javap -cp "$J" net.minecraft.world.level.storage.LevelData 2>/dev/null | grep -iE "spawn"
          echo "== Level time"
          javap -cp "$J" net.minecraft.world.level.Level 2>/dev/null | grep -iE "time|night|day"
          javap -cp "$J" net.minecraft.world.level.storage.LevelData 2>/dev/null | grep -iE "time"
          echo "== GameRules location"
          javap -cp "$J" net.minecraft.world.level.gamerules.GameRules 2>/dev/null | head -20 || true
          echo "== keep constant"
          javap -cp "$J" net.minecraft.world.level.gamerules.GameRules 2>/dev/null | grep -i keep || true
          unzip -l "$J" 2>/dev/null | grep "gamerules/" | head -20 || true
          echo "== Scoreboard"
          javap -cp "$J" net.minecraft.world.scores.Scoreboard 2>/dev/null | grep -iE "objective|score"
          echo "== Objective/ScoreAccess"
          javap -cp "$J" net.minecraft.world.scores.ScoreAccess 2>/dev/null
          javap -cp "$J" net.minecraft.world.scores.PlayerScoreEntry 2>/dev/null
      # TEMPORARY (System 12 PR): mixin targets are only checked at boot, not at compile time, so
      # print the real signatures of everything the new mixins hook. Remove before merging.
      - name: Mixin target signatures (System 12)
        if: always()
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name "*minecraft*.jar" 2>/dev/null | grep -viE "sources|javadoc|intermediary" | head -1)
          echo "== $J"
          javap -p -cp "$J" net.minecraft.world.level.ServerExplosion | grep -iE "interactWithBlocks|calculateExplodedPositions|explode|createFire" || true
          javap -p -cp "$J" net.minecraft.world.level.Level | grep -iE "destroyBlock|removeBlock" || true
          javap -p -cp "$J" net.minecraft.world.entity.ai.goal.BreakDoorGoal | grep -iE "tick" || true
          javap -p -c -cp "$J" net.minecraft.world.entity.ai.goal.BreakDoorGoal | grep -iE "removeBlock" || true
          javap -p -cp "$J" net.minecraft.world.entity.ai.goal.DoorInteractGoal | grep -iE " mob" || true
          unzip -l "$J" | grep -iE "block/Farm" || true
          javap -p -cp "$J" net.minecraft.world.level.block.FarmlandBlock | grep -iE "turnToDirt" || true
          javap -p -cp "$J" net.minecraft.world.level.block.FireBlock | grep -iE "checkBurnOut|tick" || true
          javap -p -cp "$J" net.minecraft.world.level.Explosion | grep -iE "SourceEntity" || true
          javap -p -cp "$J" net.minecraft.world.level.gamerules.GameRules | grep -iE "FIRE|TNT|GRIEF|EXPLO|DROPS" || true
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: sanctuary
          path: build/libs/*.jar
