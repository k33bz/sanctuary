name: build

on:
  push:
    branches: [main, '26.*']
  pull_request:

jobs:
  build:
    if: github.repository_owner == 'k33bz'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to push version badges to the `badges` branch (pushes to main/26.1)
    steps:
      - uses: actions/checkout@v4
      # The version this build produces, for the artifact name and the run summary.
      - name: Version
        id: version
        run: |
          v="$(grep '^mod_version=' gradle.properties | cut -d= -f2)+$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "## Sanctuary $v (\`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build + tests
        run: ./gradlew build
      - name: Worldgen copies match the Minecraft jar
        run: python3 scripts/check_worldgen.py
      - name: Diagnose mappings (only on failure)
        if: failure()
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name "*minecraft*.jar" 2>/dev/null | grep -viE "sources|javadoc|intermediary" | head -1)
          echo "== $J"
          javap -cp "$J" net.minecraft.server.level.ServerLevel 2>/dev/null | grep -iE "spawn"
          echo "== ServerPlayer"
          javap -cp "$J" net.minecraft.server.level.ServerPlayer 2>/dev/null | grep -iE "spawn|teleport"
          echo "== LevelData"
          javap -cp "$J" net.minecraft.world.level.storage.LevelData 2>/dev/null | grep -iE "spawn"
          echo "== Level time"
          javap -cp "$J" net.minecraft.world.level.Level 2>/dev/null | grep -iE "time|night|day"
          javap -cp "$J" net.minecraft.world.level.storage.LevelData 2>/dev/null | grep -iE "time"
          echo "== GameRules location"
          javap -cp "$J" net.minecraft.world.level.gamerules.GameRules 2>/dev/null | head -20 || true
          echo "== keep constant"
          javap -cp "$J" net.minecraft.world.level.gamerules.GameRules 2>/dev/null | grep -i keep || true
          unzip -l "$J" 2>/dev/null | grep "gamerules/" | head -20 || true
          echo "== Scoreboard"
          javap -cp "$J" net.minecraft.world.scores.Scoreboard 2>/dev/null | grep -iE "objective|score"
          echo "== Objective/ScoreAccess"
          javap -cp "$J" net.minecraft.world.scores.ScoreAccess 2>/dev/null
          javap -cp "$J" net.minecraft.world.scores.PlayerScoreEntry 2>/dev/null
      # Boot a real Fabric server with the jar and run scripted checks (boot, mixins apply,
      # System 12 repairs when present, the 0.8.11.2 crash). No bots needed: vanilla's
      # `execute if` answers through the console. Results land in the job summary.
      - name: Server test (real Fabric server)
        timeout-minutes: 20
        run: python3 scripts/server_test.py
      - name: Upload server-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-log
          path: |
            build/server-test/console.log
            build/server-test/logs/
            build/server-test/crash-reports/
          if-no-files-found: ignore
      # Live version badges for the README (see scripts/publish_badges.py). Release lines only:
      # a PR or feature branch must never overwrite what main/26.1 report.
      - name: Publish version badges
        if: always() && github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == '26.1') && hashFiles('build/server-test/versions.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 scripts/publish_badges.py build --branch "$GITHUB_REF_NAME" --out build/badges
          scripts/commit_badges.sh build/badges "$GITHUB_REF_NAME: ${{ steps.version.outputs.v }} @ ${GITHUB_SHA::7}"
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: sanctuary-${{ steps.version.outputs.v }}
          path: build/libs/*.jar
