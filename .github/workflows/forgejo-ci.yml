# Forgejo is the source of truth for this mod.
#
# This lives in .github/workflows on purpose. Forgejo evaluates exactly ONE
# workflow directory and .github wins over .forgejo when both exist, so a
# .forgejo/workflows file here is silently never run. Every job is therefore
# guarded on server_url: this file runs only on Forgejo, and build/deps/
# release/publish.yml run only on GitHub.
#
#   push here -> build -> compat gate (mc-test-harness e2e) -> push to GitHub
#
# GitHub is strictly downstream: it receives already-green code and runs its own
# workflows (release.yml / publish.yml) to ship to Modrinth. Do not commit
# directly on GitHub - nothing reconciles that back and the two will diverge.
name: ci

on:
  push:
    branches: [main, '26.*']
  pull_request:

jobs:
  # build and compat are one job so the jar never has to round-trip through the
  # artifact service just to reach the test step. The artifact is still
  # published at the end - that is the delivery channel for the built jar.
  build-and-compat:
    if: github.repository_owner == 'homelab'
    runs-on: debian-op
    steps:
      - uses: actions/checkout@v4

      - name: check out mc-test-harness
        uses: actions/checkout@v4
        with:
          repository: homelab/mc-test-harness
          token: ${{ secrets.FORGEJO_READ_TOKEN }}
          path: harness

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: normalise gradlew
        run: chmod +x ./gradlew

      - name: gradle build
        run: ./gradlew build --no-daemon

      # gate.js loads the mod under test from this exact path.
      - name: stage the built jar for the harness
        run: |
          mkdir -p harness/ci-artifacts/sanctuary/sanctuary
          find build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp {} harness/ci-artifacts/sanctuary/sanctuary/ \;
          ls -la harness/ci-artifacts/sanctuary/sanctuary/

      # --ignore-scripts skips the canvas/gl native builds. Those back
      # prismarine-viewer, which the gate does not use.
      - name: install harness deps
        working-directory: harness
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: compat gate
        working-directory: harness
        run: npm run gate

      - name: harness logs on failure
        if: failure()
        working-directory: harness
        run: |
          tail -n 200 server/logs/latest.log 2>/dev/null || echo "no server log"

      # Delivery. Uploads only after the compat gate has passed, so a published
      # artifact always means "built and behaviourally verified".
      - name: publish the verified jar
        uses: actions/upload-artifact@v3
        with:
          name: sanctuary-jars
          path: harness/ci-artifacts/sanctuary/sanctuary/*.jar

  push-upstream:
    needs: build-and-compat
    if: github.repository_owner == 'homelab' && github.ref == 'refs/heads/main'
    runs-on: debian-op
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: push to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "GH_PUSH_TOKEN not set"; exit 1; }
          echo "::add-mask::$GH_TOKEN"
          git push "https://x-access-token:${GH_TOKEN}@github.com/k33bz/sanctuary.git" HEAD:refs/heads/main
          git push --tags "https://x-access-token:${GH_TOKEN}@github.com/k33bz/sanctuary.git"

  # Deploy to the live server. Branch-gated because gmc101 runs Minecraft
  # 26.1.2 while main builds +26.2 - and the playbook independently refuses a
  # mismatched target, so this is belt and braces rather than a single check.
  deploy-gmc101:
    needs: build-and-compat
    if: github.repository_owner == 'homelab' && github.ref == 'refs/heads/26.1'
    runs-on: debian-op
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: build the jar to deploy
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
          ls -la build/libs/

      - name: deploy via ansible
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_REF: ${{ vars.OP_REF_CD_LS2087 }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k' EXIT
          op read "$OP_REF" </dev/null | ssh-add -
          JAR=$(find build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          test -n "$JAR" || { echo "no jar built"; exit 1; }
          echo "deploying $JAR"
          ansible-playbook -i deploy/inventory.ini deploy/deploy-gmc101.yml -e "jar=$PWD/$JAR"
