name: port-bootstrap
# TEMPORARY (removed in the next commit): resolve 26.3 dependency pins and refresh the namespaced
# worldgen copies from the 26.3 jar, then commit the result back to this branch. Needs Fabric's
# maven and Mojang, which the authoring sandbox cannot reach.
on:
  push:
    branches: [claude/port-26.3]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 25}
      - name: Dependency pins for 26.3
        run: python3 scripts/check_deps.py
      - name: Fetch the 26.3 jar (loom configure only)
        run: ./gradlew --no-daemon help
      - name: Refresh worldgen copies from the 26.3 jar
        run: python3 scripts/check_worldgen.py --write || true
      - name: Commit back
        run: |
          rm -rf scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/workflows/port-bootstrap.yml
          rm .github/workflows/port-bootstrap.yml
          git add -A
          git status --short | head -150
          git commit -qm "26.3: dependency pins + worldgen refreshed from the 26.3 jar (bootstrap)" || echo "nothing to commit"
          git push origin HEAD:claude/port-26.3
