name: port-bootstrap
# TEMPORARY (deletes itself in the commit it pushes): refresh the namespaced worldgen tree from the
# 26.3 jar with the closure-aware check_worldgen.py and commit the result back to this branch.
on:
  push:
    branches: [claude/port-26.3]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 25}
      - run: ./gradlew --no-daemon help
      - name: Worldgen registries in the 26.3 jar
        run: |
          J=$(ls ~/.gradle/caches/fabric-loom/26.3/*merged*.jar | head -1)
          unzip -Z1 "$J" 'data/minecraft/worldgen/*' | cut -d/ -f4 | sort | uniq -c
      - run: python3 scripts/check_worldgen.py --write
      - name: Confirm clean
        run: python3 scripts/check_worldgen.py
      - name: Commit back
        if: always()
        run: |
          rm -rf scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/workflows/port-bootstrap.yml && rm .github/workflows/port-bootstrap.yml
          git add -A
          git status --short | grep -v '^ M\|^M ' | head -80
          git commit -qm "26.3: worldgen closure copied from the 26.3 jar (bootstrap)" || echo "nothing to commit"
          git push origin HEAD:claude/port-26.3
