name: port-probe
# TEMPORARY: print 26.3 descriptors for every name-only mixin target. Deleted before review.
on:
  push:
    branches: [claude/port-26.3]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 25}
      - run: ./gradlew --no-daemon help -q
      - run: |
          J=$(ls ~/.gradle/caches/fabric-loom/26.3/*merged*.jar | head -1)
          d() { echo "== $1 $2"; javap -p -cp "$J" "$1" | grep -E " $2\(" ; }
          d net.minecraft.world.level.chunk.ChunkGenerator tryGenerateStructure
          d net.minecraft.world.level.chunk.ChunkGenerator findNearestMapStructure
          d net.minecraft.world.level.NaturalSpawner isValidPositionForMob
          d net.minecraft.world.entity.Mob finalizeSpawn
          d net.minecraft.world.level.ServerExplosion calculateExplodedPositions
          d net.minecraft.world.level.ServerExplosion interactWithBlocks
          d net.minecraft.world.entity.npc.villager.Villager thunderHit
          d net.minecraft.server.level.ServerPlayer getTabListDisplayName
          d net.minecraft.server.players.PlayerList canPlayerLogin
          d net.minecraft.world.level.portal.PortalShape findEmptyPortalShape
          d net.minecraft.world.level.block.FireBlock checkBurnOut
          d net.minecraft.world.entity.ai.goal.BreakDoorGoal tick
          javap -p -c -cp "$J" net.minecraft.world.entity.ai.goal.BreakDoorGoal | grep -c "removeBlock"
          javap -p -c -cp "$J" 'net.minecraft.world.entity.monster.Enderman$EndermanTakeBlockGoal' | grep -c "removeBlock"
