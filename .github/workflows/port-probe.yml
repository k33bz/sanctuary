name: port-probe
# TEMPORARY: check every mixin target against the 26.3 jar. Deleted before review.
on:
  push:
    branches: [claude/port-26.3]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 25}
      - run: ./gradlew --no-daemon help -q
      - run: python3 .github/probe/check_mixins.py "$(ls ~/.gradle/caches/fabric-loom/26.3/*merged*.jar | head -1)" .github/probe/mixins.json
