name: port-probe
# TEMPORARY: javap the 26.3 API shapes the port needs. Deleted before review.
on:
  push:
    branches: [claude/port-26.3]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 25}
      - run: ./gradlew --no-daemon help -q
      - run: |
          J=$(ls ~/.gradle/caches/fabric-loom/26.3/*merged*.jar | head -1)
          p() { echo "===== $1 ${2:-}"; javap -cp "$J" "$1" 2>&1 | grep -iE "${2:-.}" | head -60; }
          javap -cp "$J" net.minecraft.world.item.component.SwingAnimation
          javap -cp "$J" net.minecraft.world.level.levelgen.feature.Feature | head -40
          javap -cp "$J" net.minecraft.world.level.levelgen.feature.MonsterRoomFeature | head -20
          unzip -p "$J" data/minecraft/worldgen/feature/monster_room.json; echo
          unzip -p "$J" data/minecraft/worldgen/placed_feature/monster_room.json; echo
          javap -cp "$J" net.minecraft.world.level.levelgen.feature.FeatureTypes | grep -i monster
