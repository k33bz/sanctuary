plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// fabric-api-style version: modversion+mcversion, so every jar names its target game version.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Dev-server run dir. BRANCH-SPECIFIC: main (26.2) uses run262/, the 26.1 line uses run/.
// A 26.2 server silently upgrades a 26.1.2 world the moment it opens one, and that upgrade is
// irreversible, so the two lines must never share a run dir. A cross-branch
// `git checkout <otherbranch> -- build.gradle` clobbers this line (that is exactly how both
// lines ended up on run262/), so re-check it after porting. The runServer guard is the backstop.
def devRunDir = "run262"

loom {
    accessWidenerPath = file("src/main/resources/sanctuary.accesswidener")
    runs {
        server {
            runDir devRunDir
        }
    }
}

// Refuse to boot a dev server against a world that another version line created. The marker is
// written on the first boot of an empty run dir; a world that predates the marker has an unknown
// version and is refused rather than gambled on. This guards runServer only, so `./gradlew build`
// (all CI runs) is untouched.
tasks.matching { it.name == "runServer" }.configureEach {
    def guardedDir = devRunDir
    def expectedVersion = project.minecraft_version
    doFirst {
        def dir = file(guardedDir)
        def marker = new File(dir, ".sanctuary-mcversion")
        if (!new File(dir, "world").exists()) {
            dir.mkdirs()
            marker.text = expectedVersion + "\n"
        } else if (!marker.exists()) {
            throw new GradleException(
                "Run dir '" + guardedDir + "' holds a world of unknown Minecraft version, and " +
                "this branch targets " + expectedVersion + ". Opening a world with the wrong " +
                "version upgrades it irreversibly. Check " + guardedDir + "/logs/latest.log for " +
                "the version that made it, then either move the world aside or write that " +
                "version into " + marker + " to unblock.")
        } else if (marker.text.trim() != expectedVersion) {
            throw new GradleException(
                "Run dir '" + guardedDir + "' holds a Minecraft " + marker.text.trim() + " world " +
                "but this branch targets " + expectedVersion + ". Booting would upgrade it " +
                "irreversibly. Point this branch at its own run dir (devRunDir in build.gradle).")
        }
    }
}

repositories {
    // Loom adds Minecraft + Fabric repositories automatically.
    maven { url = 'https://maven.nucleoid.xyz' } // Polymer (experiment)
    maven { url = 'https://gitlab.com/api/v4/projects/21830712/packages/maven' } // Flan (Flemmli97)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings dependency: Minecraft 26.x ships un-obfuscated.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // sgui — standalone server-side GUI library (vanilla-client compatible, no Polymer needed).
    include(implementation("eu.pb4:sgui:2.1.0+26.2"))
    // Permission nodes (sanctuary.anchor.create/break). LuckPerms implements this API when
    // installed; without a permission mod the defaults apply, so it is safely optional.
    include(implementation("me.lucko:fabric-permissions-api:0.7.0"))
    // Flan (soft dependency): compile against its claim API; at runtime the integration only
    // activates when the Flan mod is actually installed (FlanIntegration guards on isModLoaded).
    // NOTE: no Flan build for 26.2 yet — compiling against the 26.1.2 API jar is fine
    // (compileOnly needs signatures only; runtime is gated on isModLoaded). Re-pin when it ports.
    compileOnly "io.github.flemmli97:flan:26.1.2-1.12.7-fabric"

    // Pure-logic unit tests (SurvivalLogic) — no game runtime required.
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
