# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric versions — verified against meta.fabricmc.net + the official example-mod (June 2026).
# MC 26.x is un-obfuscated: no mappings dependency, no mixin refmap.
minecraft_version=26.1.2
# The FLOOR, and it must never exceed the loader gmc101 runs (0.19.5 since 2026-10-01). A jar built
# against a newer loader than the server's crashes it at boot (0.19.5 jar on 0.19.3: MixinExtras
# ClassCastException transforming BreakDoorGoal); a newer server than the floor is always fine.
# Move gmc101 first (AMP kvp Minecraft.FabricLoaderVersion + the launcher jar), then this.
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
fabric_api_version=0.155.3+26.1.2

# Mod metadata
mod_version=0.8.12.2
maven_group=com.k33bz.sanctuary
archives_base_name=sanctuary
